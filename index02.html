<!-- Declara que es un documento HTML5, No es una etiqueta, es una instruccion -->
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Siempre va a contener todos los metadatos, todo los imports y configuraciones de la pagina -->
    <meta charset="UTF-8">
    <!-- Este tipo de directiva ayuda al posicionamiento del sitio/web
         , ayuda a ser mejor rastreada e indexada -->
    <meta name="description" content="Pagina web para la materia de aplicaciones web">

    <!-- Este es el inicio para aplicaciones responsivas/adaptables a pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pagina web mas</title>
</head>

<body>
    <!--Contenido visible-->
    Hola mundo
    <!--Los tag/etiquetas mas importantes-->
    <!--Los Titulos-->
    <h1>Titulo1</h1> <!--Lo recomendable es solo usar h5-->
    <h2>Titulo2</h2>
    <h3>Titulo3</h3>
    <h4>Titulo4</h4>
    <h5>Titulo5</h5>
    <h6>Titulo6</h6>

    <!--Parrafos y Divisiones-->
    <p>
        Este es un parrafo y sirve para emparrafar un texto
    </p>

    <div>
        Esta es una division que sirve para colocar texto
    </div>
    
    <br/> <!--Salto de linea-->
    <br> <!--Salto de linea-->

    <center> <!--Esto no deberia existir-->
        Hay una regla no escrita que dice: No debe de existar nada fuera de una etiqueta.
    </center>

</body>

</html>
